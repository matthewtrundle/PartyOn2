# Quarterly refresh of the vendored datacenter IP ranges used for bot
# classification (src/lib/analytics/datacenter-ranges.json).
#
# Pulls the providers' official feeds, drops reserved-space junk (Vultr has
# shipped test-nets, doc space and 6to4 before), validates the regenerated data
# against the matcher's unit tests IN THIS RUN, and opens a PR only when the
# data actually changed. Review cue: the "largest accepted" line per source in
# the run log — an anomalously huge prefix is the feed-poisoning tell.
#
# A failed run (e.g. AWS/GCP/Azure feed unreachable) emails the repo watchers,
# which is the fallback reminder.

name: Refresh Datacenter IP Ranges

on:
  schedule:
    # 1st of Jan/Apr/Jul/Oct, 14:00 UTC (8/9am Central)
    - cron: '0 14 1 1,4,7,10 *'
  workflow_dispatch: # manual runs from the GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Regenerate ranges from official provider feeds
        run: node scripts/analytics/update-datacenter-ranges.mjs | tee generator.log

      - name: Check whether the data changed
        id: diff
        run: |
          if git diff --quiet -- src/lib/analytics/datacenter-ranges.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ranges unchanged since last refresh — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/lib/analytics/datacenter-ranges.json
          fi

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        env:
          # Placeholder so prisma generate (postinstall) can resolve the
          # datasource env(); the tests never open a connection.
          POSTGRES_URL: postgresql://test:test@localhost:5432/test
        run: npm ci

      - name: Validate regenerated data against the matcher tests
        if: steps.diff.outputs.changed == 'true'
        run: npx vitest run src/lib/analytics/__tests__/datacenter-ip.test.ts src/app/api/webhooks/vercel-drain/__tests__/route.test.ts

      - name: Build PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo 'Quarterly automated refresh of the vendored cloud IP ranges (bot classification).'
            echo
            echo '**Validated in this run**: matcher + drain-route unit tests passed against the regenerated data (reserved-space regressions would have failed the run).'
            echo
            echo '**Review cue**: scan the per-source `largest accepted` lines below — an anomalously huge prefix is the feed-poisoning tell.'
            echo
            echo '```'
            cat generator.log
            echo '```'
            echo
            echo 'After merging, optionally re-score history: `npx tsx scripts/analytics/backfill-datacenter-flag.ts` (see its header — old rows keep their stamp unless you NULL the column first).'
            echo
            echo 'If the required Test & Lint check did not trigger (bot-created PRs sometimes skip it), close and reopen this PR.'
          } > pr-body.md

      - name: Open PR with the refreshed ranges
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-datacenter-ranges
          delete-branch: true
          base: main
          add-paths: src/lib/analytics/datacenter-ranges.json
          commit-message: 'chore(analytics): quarterly datacenter IP range refresh'
          title: '🤖 Quarterly datacenter IP range refresh'
          body-path: pr-body.md
          labels: automated, analytics
