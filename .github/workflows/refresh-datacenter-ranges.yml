# Quarterly refresh of the vendored datacenter IP ranges used for bot
# classification (src/lib/analytics/datacenter-ranges.json).
#
# Pulls the providers' official feeds, drops reserved-space junk (Vultr has
# shipped test-nets, doc space and 6to4 before), validates the regenerated data
# against the matcher's unit tests IN THIS RUN, and opens a PR only when the
# data actually changed. Review cue: the "largest accepted" line per source in
# the run log — an anomalously huge prefix is the feed-poisoning tell.
#
# A failed run (e.g. AWS/GCP/Azure feed unreachable) emails the repo watchers,
# which is the fallback reminder.

name: Refresh Datacenter IP Ranges

on:
  schedule:
    # 1st of Jan/Apr/Jul/Oct, 14:00 UTC (8/9am Central)
    - cron: '0 14 1 1,4,7,10 *'
  workflow_dispatch: # manual runs from the GitHub UI
    inputs:
      force:
        description: 'Run the delivery path (push branch + open issue) even if the ranges are unchanged'
        type: boolean
        default: false

# Only what's actually used: push the branch (contents) and open the reminder
# issue (issues). We deliberately do NOT create the PR from the workflow — this
# repo has "Allow GitHub Actions to create and approve pull requests" disabled,
# and even with it on a bot-created PR skips the required Test & Lint check.
# A human opening the PR from the pushed branch runs CI normally.
permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Regenerate ranges from official provider feeds
        run: node scripts/analytics/update-datacenter-ranges.mjs | tee generator.log

      - name: Check whether the data changed
        id: diff
        run: |
          if git diff --quiet -- src/lib/analytics/datacenter-ranges.json; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Ranges unchanged, but this is a forced run — exercising the delivery path."
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Ranges unchanged since last refresh — nothing to do."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/lib/analytics/datacenter-ranges.json
          fi

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        env:
          # Placeholder so prisma generate (postinstall) can resolve the
          # datasource env(); the tests never open a connection.
          POSTGRES_URL: postgresql://test:test@localhost:5432/test
        run: npm ci

      - name: Validate regenerated data against the matcher tests
        if: steps.diff.outputs.changed == 'true'
        run: npx vitest run src/lib/analytics/__tests__/datacenter-ip.test.ts src/app/api/webhooks/vercel-drain/__tests__/route.test.ts

      - name: Push the refreshed ranges to a branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Fresh branch off the current main checkout; force so a stale branch
          # from a prior unmerged quarter is replaced rather than conflicting.
          git switch -c auto-datacenter-ranges
          git add src/lib/analytics/datacenter-ranges.json
          # A forced test run with no real change has nothing staged; keep the
          # branch push meaningful with an empty commit rather than failing.
          git commit -m "chore(analytics): quarterly datacenter IP range refresh" \
            || git commit --allow-empty -m "chore(analytics): datacenter range refresh (forced run, no data change)"
          git push --force origin auto-datacenter-ranges

      - name: Open a reminder issue with a one-click PR link
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'The quarterly datacenter IP range refresh ran and the data changed.'
            echo
            echo 'Branch `auto-datacenter-ranges` is pushed with the new data, **already validated in this run** against the matcher + drain-route unit tests (a reserved-space regression would have failed the run before this issue was opened).'
            echo
            echo '👉 **Open the PR:** ${{ github.server_url }}/${{ github.repository }}/compare/main...auto-datacenter-ranges?expand=1'
            echo
            echo 'Opening it yourself (rather than the bot) means the required Test & Lint check runs normally. Review cue: scan the per-source `largest accepted` lines below — an anomalously huge prefix is the feed-poisoning tell.'
            echo
            echo '```'
            cat generator.log
            echo '```'
            echo
            echo 'After merging, optionally re-score history: `npx tsx scripts/analytics/backfill-datacenter-flag.ts` (dry-run default; see its header).'
          } > issue-body.md
          gh issue create \
            --title "🤖 Quarterly datacenter IP range refresh ready to merge" \
            --body-file issue-body.md
