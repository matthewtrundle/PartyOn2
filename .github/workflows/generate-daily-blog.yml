name: Generate Daily Blog Post

# DORMANT: the daily schedule is intentionally disabled. All 107 topics in
# scripts/topics.json are published, so this generated nothing new after
# 2026-01-19 — it just ran green daily and committed nothing (the commit step
# is guarded on a diff). New blog content now lands via manual SEO PRs to main.
# To resume automated posting: add unpublished topics to scripts/topics.json,
# then re-enable the `schedule:` trigger below. Manual runs still work via the
# Actions tab (workflow_dispatch). NOTE: this only ever committed to `dev` — the
# old "Create Pull Request to Main" step never worked (repo blocks Actions from
# creating PRs) and has been removed; promote dev→main with a manual PR.
on:
  # schedule:
  #   - cron: '0 14 * * *'   # disabled — topic backlog exhausted (see note above)
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Generate blog post
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run generate-blog

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/blog/posts/
          git add public/images/blog/
          git add scripts/topics.json
          git diff --staged --quiet || git commit -m "🤖 Auto-generate daily blog post [skip ci]"
          git pull --rebase origin dev
          git push origin dev

      - name: Note next step
        run: echo "If a post was generated it is committed to 'dev'. Promote to main with a manual PR when ready (this repo blocks Actions from opening PRs)."
