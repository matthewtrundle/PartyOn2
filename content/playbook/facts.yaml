  # ---- cancellation, refunds, returns ----
  - id: cancellation-48h
    statement: "Orders/events cancelled 48+ hours before the scheduled time receive a full refund. Cancellations within 48 hours may be subject to a cancellation fee."
    status: verified
    sources: ["src/app/terms/page.tsx:75", "src/app/faqs/page.tsx:66"]
    last_verified: 2026-07-06

  - id: cancellation-fee-amount
    statement: "There is no fixed cancellation fee — inside 48 hours it's case-by-case and usually waived. The bot may say a fee 'may apply' but never quotes an amount."
    status: verified
    sources: ["operator answer 2026-07-07 (open question cancellation-fee)"]
    last_verified: 2026-07-07

  - id: reschedule-window
    statement: "Rescheduling and cancelling are different policies, and both are real: moving your delivery date/time (reschedule) is free up to 6 hours before delivery; cancelling outright follows the 48-hour refund policy (48+ hours = full refund; inside 48 hours a fee may apply)."
    status: verified
    sources: ["operator answer 2026-07-07 (open question reschedule-vs-cancellation)", "src/components/landing/configs/bachelor.ts", "src/app/terms/page.tsx:75"]
    last_verified: 2026-07-07

