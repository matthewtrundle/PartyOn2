  - id: lake-travis-250-minimum
    statement: "Two different minimums, both real: standard ADDRESS delivery always follows the confirmed checkout zone minimum (Lakeway 78734 = Greater Austin, $125), while Lake Travis boat/ranch EVENT deliveries start at a $250 minimum (event logistics). The bachelor page's 'start at $250' refers to event deliveries; it does not change any zone minimum."
    status: verified
    sources: ["operator answer 2026-07-07 (open question lake-travis-minimum)", "src/components/landing/configs/bachelor.ts", "src/lib/delivery/rates.ts"]
