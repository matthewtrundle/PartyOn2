    sources: ["src/app/faqs/page.tsx:83", "src/app/terms/page.tsx"]
    last_verified: 2026-07-06

  - id: refund-processing-sop
    statement: "Approved refunds go back to the original payment method via Stripe and typically appear in 5–10 business days. Only Allan approves refunds — the bot acknowledges and escalates, and never promises eligibility, amount, or approval."
    status: verified
    sources: ["operator answer 2026-07-07 (open question refund-sop)"]
    last_verified: 2026-07-07

  # ---- service area (beyond the generated zone facts) ----
  - id: service-area-cities
    statement: "Delivery covers the greater Austin metro: downtown Austin, Lake Travis, Westlake, Bee Cave, Lakeway, Cedar Park and surrounding communities (zip-code validated at checkout)."
