  - id: contact-phone
    statement: "Party On Delivery's phone number is (737) 371-9700 (call or text)."
    status: verified
    sources: ["src/app/faqs/page.tsx footer", "landing configs CTA"]
    last_verified: 2026-07-06

  - id: contact-email
    statement: "The customer-service email is info@partyondelivery.com."
    status: verified
