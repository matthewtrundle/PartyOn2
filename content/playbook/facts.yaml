# Curated facts registry for the Customer Communication Playbook.
#
# Every fact an auto-reply may state MUST exist here (or in facts-generated.yaml)
# with status: verified. Facts with status conflicting or unknown are NEVER
# ingested into any prompt — they exist to make the gap visible and are paired
# with an entry in open-questions.md for Allan to adjudicate.
#
# Numeric delivery-zone facts live in facts-generated.yaml (code-authoritative,
# regenerated from src/lib/delivery/rates.ts). This file holds everything else.
#
# status: verified    → safe to state to a customer
#         conflicting → two live sources disagree; do not state either version
#         unknown     → asked by customers but no authoritative source exists
facts:
